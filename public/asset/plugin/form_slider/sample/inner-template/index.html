<html>
<head>
  <meta charset="utf-8">

  <script src="../../programs/form_slider.js" rel="form_slider" data-play="auto" data-selector=".mynt-contact"></script>

</head>
<body>
	<div class="mynt-contact"></div>

  <script>
    new $$form_slider({
      debug             : false,
      base_selector     : ".mynt-contact",
      template_selector : ".template",
      first_file        : "step-1",

      submit : {
        url        : "./post.php",
        query      : {
          "a":"test_1"
        },
        onSuccess  : function(res){
          console.log("posted : "+ res);
        },
        succes_url : "./conversion.html"
      }
    });
  </script>
  <div class="template">
    <div data-template="step-1">
      <input type="hidden" name="mode" value="sample-post">

      <div class="summary">お問い合わせは、どのような内容ですか？</div>
      <section class="genre">
        <div>
          <label>
            <input type="radio" name="genre" value="genre-1">
            <span type="text">会社に関する全般的なお問い合わせ</span>
          </label>
        </div>
        <div>
          <label>
            <input type="radio" name="genre" value="genre-2">
            <span type="text">弊社サービスに関するお問い合わせ</span>
          </label>
        </div>
        <div>
          <label>
            <input type="radio" name="genre" value="genre-3">
            <span type="text">開発の相談・依頼に関するお問い合わせ</span>
          </label>
        </div>
        <div>
          <label>
            <input type="radio" name="genre" value="genre-4">
            <span type="text">技術に関するお問い合わせ</span>
          </label>
        </div>
        <div>
          <label>
            <input type="radio" name="genre" value="genre-5">
            <span type="text">採用に関するお問い合わせ</span>
          </label>
        </div>
        <div>
          <label>
            <input type="radio" name="genre" value="genre-6">
            <span type="text">弊社に対して営業したい</span>
          </label>
        </div>
        <div>
          <label>
            <input type="radio" name="genre" value="genre-7">
            <span type="text">その他</span>
          </label>
        </div>
        <div class="comment" data-formSlider-toggle="genre" data-formSlider-toggle-value="genre-7">
          <input type="text" name="genre_comment">
        </div>
      </section>
      <div class="slider-buttons">
        <button type="button" data-mode="next" data-file="step-2">次へ</button>
      </div>
    </div>

    <div data-template="step-2">
      <div class="summary">あなたの情報を入力してください。</div>
      <section class="user-info">
      
        <div class="line">
          <div class="label">会社名</div>
          <input type="text" name="company_name" value="" placeholder="会社名">
        </div>
          
        <div class="line">
          <div class="label">役職</div>
          <input type="text" name="position" value="" placeholder="役職">
        </div>
      
        <div class="line">
          <div class="label">お名前</div>
          <input type="text" name="name" value="" placeholder="お名前">
        </div>
      
        <div class="line">
          <div class="label">メール</div>
          <input type="text" name="mail" value="" placeholder="メールアドレス">
        </div>
      </section>
      <div class="slider-buttons">
        <button type="button" data-mode="prev" data-file="step-1">戻る</button>
        <button type="button" data-mode="next" data-file="step-3">次へ</button>
      </div>
    </div>

    <div data-template="step-3">
      <div class="summary">お問い合わせ内容を入力してください。</div>
      <section class="message">
        <div class="line">
          <textarea type="text" name="message" placeholder="会社名"></textarea>
        </div>
      </section>
      <div class="slider-buttons">
        <button type="button" data-mode="prev" data-file="step-2">戻る</button><br>
        <button type="button" data-mode="next" data-file="confirm">確認</button><br>
      </div>
    </div>

    <div data-template="confirm">
      <div class="summary">入力した内容をご確認ください。</div>
      <section class="confirm">
        <div class="line">
          <div>
            <span type="form-text" name="genre"></span>
            <div type="form-value" name="genre_comment"></div>
          </div>
        </div>

        <div class="line">
          <div class="label">会社名</div>
          <span type="form-value" name="company_name"></span>
        </div>
          
        <div class="line">
          <div class="label">役職</div>
          <span type="form-value" name="position"></span>
        </div>

        <div class="line">
          <div class="label">お名前</div>
          <span type="form-value" name="name"></span>
        </div>

        <div class="line">
          <div class="label">メール</div>
          <span type="form-value" name="mail"></span>
        </div>

        <div class="line">
          <div class="label">内容</div>
          <span type="form-value" name="message"></span>
        </div>
      </section>

      <div class="slider-buttons">
        <button type="button" data-mode="prev" data-file="step-1">修正</button>
        <button type="button" data-mode="submit" data-file="conversion">送信</button>
      </div>
    </div>

  </div>
</body>


</html>
